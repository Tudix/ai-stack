[project]
name = "ai-stack"
version = "0.1.0"
description = "A self-hosted AI stack. Its first component is an OpenAI-compatible gateway that routes each request to a local model or a cloud API and records tokens, latency and cost per request."
readme = "README.md"
authors = [
    { name = "Tudix", email = "101678482+Tudix@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156.1",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "openai>=3.35.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
